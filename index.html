<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xadrez Guiado - Caminho até 800 Rating</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #3d2314 linear-gradient(135deg, rgba(0,0,0,0.5), rgba(0,0,0,0.8));
      background-size: cover;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #f0e6d2;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.2rem;
      color: #f3e5ab;
      text-shadow: 2px 2px 4px #000;
      margin-bottom: 5px;
    }

    p.subtitle {
      font-size: 1rem;
      color: #c2b280;
    }

    .container {
      max-width: 600px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* TELA 1: MENU INICIAL */
    #menu-screen {
      background: rgba(20, 10, 5, 0.9);
      border: 2px solid #8b5a2b;
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    .menu-title {
      font-size: 1.3rem;
      color: #e6c687;
      border-bottom: 1px solid #8b5a2b;
      padding-bottom: 8px;
      width: 100%;
      text-align: center;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    label {
      font-weight: bold;
      font-size: 1rem;
      color: #f3e5ab;
    }

    .color-buttons {
      display: flex;
      gap: 15px;
      width: 100%;
    }

    .btn-color {
      flex: 1;
      padding: 12px;
      background: #5c3a21;
      color: #fff;
      border: 2px solid #a67c52;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-color:hover {
      background: #7a4e2c;
    }

    .btn-color.selected {
      background: #2e7d32;
      border-color: #81c784;
      box-shadow: 0 0 12px rgba(76, 175, 80, 0.7);
    }

    select {
      background: #2b180d;
      color: #f3e5ab;
      border: 1px solid #8b5a2b;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      width: 100%;
      cursor: pointer;
    }

    .btn-start {
      background: #2e7d32;
      color: #fff;
      border: 2px solid #81c784;
      padding: 14px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      transition: all 0.2s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .btn-start:hover {
      background: #388e3c;
      transform: translateY(-2px);
    }

    /* TELA 2: TABULEIRO E JOGO */
    #game-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: rgba(20, 10, 5, 0.85);
      border: 1px solid #8b5a2b;
      padding: 10px 15px;
      border-radius: 8px;
    }

    .game-title-info {
      font-weight: bold;
      color: #e6c687;
      font-size: 0.95rem;
    }

    .btn-back {
      background: #78909c;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-back:hover {
      background: #607d8b;
    }

    .feedback-box {
      background: rgba(0, 0, 0, 0.75);
      border-left: 4px solid #4caf50;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 0.95rem;
      line-height: 1.4;
      width: 100%;
      min-height: 55px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    .feedback-box .bad-tip {
      color: #ff6b6b;
      margin-top: 4px;
      display: block;
    }

    /* Tabuleiro Verde e Branco (Estilo Napa Escolar) */
    .board-wrapper {
      border: 12px solid #2a160a;
      border-radius: 8px;
      box-shadow: 0 12px 24px rgba(0,0,0,0.8);
      background: #2a160a;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(8, 56px);
      grid-template-rows: repeat(8, 56px);
      width: 448px;
      height: 448px;
      user-select: none;
    }

    .square {
      width: 56px;
      height: 56px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 38px;
      position: relative;
      cursor: pointer;
    }

    .square.white {
      background-color: #eeeed2;
    }

    .square.black {
      background-color: #769656;
    }

    /* Iluminação do Teclado (Melhor e Pior Lance) */
    .square.best-move {
      box-shadow: inset 0 0 0 4px #2e7d32, 0 0 12px #4caf50;
      background-color: rgba(76, 175, 80, 0.65) !important;
      animation: pulse-green 1.5s infinite alternate;
    }

    .square.worst-move {
      box-shadow: inset 0 0 0 4px #c62828, 0 0 12px #f44336;
      background-color: rgba(244, 67, 54, 0.65) !important;
      animation: pulse-red 1.5s infinite alternate;
    }

    @keyframes pulse-green {
      from { box-shadow: inset 0 0 0 3px #2e7d32, 0 0 6px #4caf50; }
      to { box-shadow: inset 0 0 0 5px #1b5e20, 0 0 16px #81c784; }
    }

    @keyframes pulse-red {
      from { box-shadow: inset 0 0 0 3px #c62828, 0 0 6px #f44336; }
      to { box-shadow: inset 0 0 0 5px #8e0000, 0 0 16px #e57373; }
    }

    .piece {
      z-index: 2;
      line-height: 1;
    }

    .legend {
      display: flex;
      gap: 15px;
      justify-content: center;
      font-size: 0.85rem;
      margin-top: 5px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }

    .dot.green { background: #4caf50; box-shadow: 0 0 6px #4caf50; }
    .dot.red { background: #f44336; box-shadow: 0 0 6px #f44336; }

    @media (max-width: 500px) {
      #board {
        grid-template-columns: repeat(8, 42px);
        grid-template-rows: repeat(8, 42px);
        width: 336px;
        height: 336px;
      }
      .square {
        width: 42px;
        height: 42px;
        font-size: 28px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>♟️ Xadrez Guiado</h1>
    <p class="subtitle">Aprendizado intuitivo por contraste até o xeque-mate</p>
  </header>

  <div class="container">
    
    <!-- TELA 1: MENU INICIAL -->
    <div id="menu-screen">
      <div class="menu-title">Configurar Treinamento</div>

      <div class="form-group">
        <label>1. Escolha suas peças:</label>
        <div class="color-buttons">
          <button class="btn-color selected" id="btn-w" onclick="selectSide('w')">⚪ Brancas</button>
          <button class="btn-color" id="btn-b" onclick="selectSide('b')">⚫ Pretas</button>
        </div>
      </div>

      <div class="form-group">
        <label for="opening-select">2. Escolha o Estudo / Abertura:</label>
        <select id="opening-select">
          <!-- Preenchido via Javascript baseado na cor escolhida -->
        </select>
      </div>

      <button class="btn-start" onclick="startGame()">🚀 Iniciar Treinamento</button>
    </div>

    <!-- TELA 2: ÁREA DE JOGO -->
    <div id="game-screen">
      <div class="game-header">
        <span class="game-title-info" id="current-opening-title">Italiana</span>
        <button class="btn-back" onclick="returnToMenu()">⚙️ Alterar Estudo</button>
      </div>

      <div class="feedback-box" id="feedback">
        Carregando instrução...
      </div>

      <div class="board-wrapper">
        <div id="board"></div>
      </div>

      <div class="legend">
        <div class="legend-item"><span class="dot green"></span> 🟢 Melhor Lance</div>
        <div class="legend-item"><span class="dot red"></span> 🔴 Pior Casa (Evite!)</div>
      </div>
    </div>

  </div>

  <script>
    // Peças Unicode Corrigidas (Cavalo Preto ajustado para ♞)
    const PIECES = {
      'P': '♙', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔',
      'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚'
    };

    // BANCO DE DADOS DE ESTUDOS E ABERTURAS
    const STUDY_TREES = {
      'w': [
        {
          id: 'pastor_white',
          name: '⚔️ Ataque Pastor (Brancas)',
          steps: [
            {
              playerMove: { from: 'e2', to: 'e4' },
              worstMove: { from: 'a2', to: 'a3' },
              tip: "🟢 <b>Melhor:</b> Domine o centro com e4! Libera caminhos para o Bispo e a Dama.<br><span class='bad-tip'>🔴 <b>Pior:</b> a3 é passivo e cede a iniciativa.</span>",
              cpuResponse: { from: 'e7', to: 'e5' }
            },
            {
              playerMove: { from: 'f1', to: 'c4' },
              worstMove: { from: 'f1', to: 'e2' },
              tip: "🟢 <b>Melhor:</b> Bispo em c4 aponta direto para a casa fraca f7 do adversário!<br><span class='bad-tip'>🔴 <b>Pior:</b> Be2 é defensivo demais.</span>",
              cpuResponse: { from: 'b8', to: 'c6' }
            },
            {
              playerMove: { from: 'd1', to: 'f3' },
              worstMove: { from: 'd1', to: 'e2' },
              tip: "🟢 <b>Melhor:</b> Dama em f3 cria a ameaça imediata de Xeque-Mate em f7!<br><span class='bad-tip'>🔴 <b>Pior:</b> De2 remove a pressão do ataque.</span>",
              cpuResponse: { from: 'd7', to: 'd6' }
            },
            {
              playerMove: { from: 'f3', to: 'f7' },
              worstMove: { from: 'f3', to: 'f6' },
              tip: "🏆 <b>XEQUE-MATE!</b> Dama toma f7 protegida pelo bispo de c4. Vitória limpa e rápida!<br><span class='bad-tip'>🔴 <b>Pior:</b> Df6 apenas entrega a Dama.</span>",
              cpuResponse: null
            }
          ]
        },
        {
          id: 'italian_white',
          name: '🇮🇹 Abertura Italiana (Brancas)',
          steps: [
            {
              playerMove: { from: 'e2', to: 'e4' },
              worstMove: { from: 'h2', to: 'h3' },
              tip: "🟢 <b>Melhor:</b> e4 ocupa o centro e abre linhas de desenvolvimento.<br><span class='bad-tip'>🔴 <b>Pior:</b> h3 desperdiça o primeiro lance da partida.</span>",
              cpuResponse: { from: 'e7', to: 'e5' }
            },
            {
              playerMove: { from: 'g1', to: 'f3' },
              worstMove: { from: 'g1', to: 'h3' },
              tip: "🟢 <b>Melhor:</b> Cavalo em f3 desenvolve peça e ataca o peão preto de e5.<br><span class='bad-tip'>🔴 <b>Pior:</b> Cavalo no canto (h3) perde alcance e controle central.</span>",
              cpuResponse: { from: 'b8', to: 'c6' }
            },
            {
              playerMove: { from: 'f1', to: 'c4' },
              worstMove: { from: 'f1', to: 'e2' },
              tip: "🟢 <b>Melhor:</b> Bispo em c4 estabelece a sólida Italiana, mirando a fraqueza f7.<br><span class='bad-tip'>🔴 <b>Pior:</b> Be2 bloqueia a própria diagonal do ataque.</span>",
              cpuResponse: { from: 'f8', to: 'c5' }
            },
            {
              playerMove: { from: 'c2', to: 'c3' },
              worstMove: { from: 'b2', to: 'b3' },
              tip: "🟢 <b>Melhor:</b> c3 prepara o avanço d4 para dominar o centro por completo!<br><span class='bad-tip'>🔴 <b>Pior:</b> b3 é lento e não luta pelo controle do centro.</span>",
              cpuResponse: null
            }
          ]
        },
        {
          id: 'spanish_white',
          name: '🇪🇸 Abertura Espanhola - Ruy Lopez (Brancas)',
          steps: [
            {
              playerMove: { from: 'e2', to: 'e4' },
              worstMove: { from: 'a2', to: 'a4' },
              tip: "🟢 <b>Melhor:</b> O clássico e4 ocupando o centro!<br><span class='bad-tip'>🔴 <b>Pior:</b> a4 avança a ala do rei sem propósito estratégico.</span>",
              cpuResponse: { from: 'e7', to: 'e5' }
            },
            {
              playerMove: { from: 'g1', to: 'f3' },
              worstMove: { from: 'f2', to: 'f3' },
              tip: "🟢 <b>Melhor:</b> Nf3 desenvolve atacando o peão de e5.<br><span class='bad-tip'>🔴 <b>Pior:</b> f3 tira a casa natural do cavalo e enfraquece o rei.</span>",
              cpuResponse: { from: 'b8', to: 'c6' }
            },
            {
              playerMove: { from: 'f1', to: 'b5' },
              worstMove: { from: 'f1', to: 'd3' },
              tip: "🟢 <b>Melhor:</b> Bispo em b5 (Espanhola) pressiona o cavalo que defende o peão de e5!<br><span class='bad-tip'>🔴 <b>Pior:</b> Bd3 bloqueia o avanço do peão de d2.</span>",
              cpuResponse: null
            }
          ]
        }
      ],
      'b': [
        {
          id: 'anti_pastor_black',
          name: '🛡️ Defesa Implacável contra o Pastor (Pretas)',
          steps: [
            // CPU começa jogando e4
            {
              cpuBefore: { from: 'e2', to: 'e4' },
              playerMove: { from: 'e7', to: 'e5' },
              worstMove: { from: 'f7', to: 'f6' },
              tip: "🟢 <b>Melhor:</b> Responda com e5 igualando a disputa pelo centro.<br><span class='bad-tip'>🔴 <b>Pior:</b> f6 enfraquece a diagonal do seu Rei gravemente!</span>",
              cpuResponse: { from: 'f1', to: 'c4' }
            },
            {
              playerMove: { from: 'b8', to: 'c6' },
              worstMove: { from: 'g8', to: 'h6' },
              tip: "🟢 <b>Melhor:</b> Cavalo em c6 defende seu peão em e5 e desenvolve força no jogo.<br><span class='bad-tip'>🔴 <b>Pior:</b> Nh6 deixa a peça passiva na borda.</span>",
              cpuResponse: { from: 'd1', to: 'h5' } // Brancas tentam mate do pastor
            },
            {
              playerMove: { from: 'g7', to: 'g6' },
              worstMove: { from: 'g8', to: 'f6' },
              tip: "🟢 <b>Melhor:</b> Peão em g6 bloqueia a Dama branca em f7 e força a retirada dela!<br><span class='bad-tip'>🔴 <b>Pior:</b> Nf6 direto permite que a Dama capture f7 com xeque-mate!</span>",
              cpuResponse: { from: 'h5', to: 'f3' } // Dama recua insistindo
            },
            {
              playerMove: { from: 'g8', to: 'f6' },
              worstMove: { from: 'd7', to: 'd6' },
              tip: "🏆 <b>REFUTADO!</b> Cavalo f6 desenvolve atacando e sela totalmente a ameaça de mate!<br><span class='bad-tip'>🔴 <b>Pior:</b> d6 esquece o ataque contínuo sobre f7.</span>",
              cpuResponse: null
            }
          ]
        },
        {
          id: 'scandinavian_black',
          name: '🛡️ Defesa Escandinava (Pretas)',
          steps: [
            {
              cpuBefore: { from: 'e2', to: 'e4' },
              playerMove: { from: 'd7', to: 'd5' },
              worstMove: { from: 'a7', to: 'a6' },
              tip: "🟢 <b>Melhor:</b> d5 desafia diretamente o centro das brancas no primeiro lance!<br><span class='bad-tip'>🔴 <b>Pior:</b> a6 é passivo e aceita o domínio total das brancas.</span>",
              cpuResponse: { from: 'e4', to: 'd5' }
            },
            {
              playerMove: { from: 'd8', to: 'd5' },
              worstMove: { from: 'c8', to: 'f5' },
              tip: "🟢 <b>Melhor:</b> Dama toma d5 centralizando com autoridade.<br><span class='bad-tip'>🔴 <b>Pior:</b> Bf5 ignora a captura do peão central.</span>",
              cpuResponse: { from: 'b1', to: 'c3' }
            },
            {
              playerMove: { from: 'd5', to: 'a5' },
              worstMove: { from: 'd5', to: 'd8' },
              tip: "🟢 <b>Melhor:</b> Dama em a5 se retira com segurança mantendo pressão na ala da dama.<br><span class='bad-tip'>🔴 <b>Pior:</b> Dd8 recua tudo e perde os tempos conquistados.</span>",
              cpuResponse: null
            }
          ]
        },
        {
          id: 'carokann_black',
          name: '🛡️ Defesa Caro-Kann (Pretas)',
          steps: [
            {
              cpuBefore: { from: 'e2', to: 'e4' },
              playerMove: { from: 'c7', to: 'c6' },
              worstMove: { from: 'h7', to: 'h6' },
              tip: "🟢 <b>Melhor:</b> c6 é a preparação perfeita para avançar d5 de forma super sólida!<br><span class='bad-tip'>🔴 <b>Pior:</b> h6 não contribui em nada para o desenvolvimento.</span>",
              cpuResponse: { from: 'd2', to: 'd4' }
            },
            {
              playerMove: { from: 'd7', to: 'd5' },
              worstMove: { from: 'e7', to: 'e6' },
              tip: "🟢 <b>Melhor:</b> d5 golpeia o centro das brancas apoiado pelo peão de c6.<br><span class='bad-tip'>🔴 <b>Pior:</b> e6 prende seu próprio bispo de casas claras.</span>",
              cpuResponse: null
            }
          ]
        }
      ]
    };

    // Estado da Aplicação
    let selectedSide = 'w';
    let currentTree = null;
    let currentStepIdx = 0;
    let isProcessingCpu = false;

    const initialBoardState = [
      ['r','n','b','q','k','b','n','r'],
      ['p','p','p','p','p','p','p','p'],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['P','P','P','P','P','P','P','P'],
      ['R','N','B','Q','K','B','N','R']
    ];

    let boardState = [];

    function selectSide(side) {
      selectedSide = side;
      document.getElementById('btn-w').classList.toggle('selected', side === 'w');
      document.getElementById('btn-b').classList.toggle('selected', side === 'b');
      updateOpeningSelectOptions();
    }

    function updateOpeningSelectOptions() {
      const select = document.getElementById('opening-select');
      select.innerHTML = '';
      STUDY_TREES[selectedSide].forEach((tree, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = tree.name;
        select.appendChild(opt);
      });
    }

    function startGame() {
      const idx = document.getElementById('opening-select').value;
      currentTree = STUDY_TREES[selectedSide][idx];
      
      document.getElementById('menu-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'flex';
      document.getElementById('current-opening-title').textContent = currentTree.name;

      resetBoard();
    }

    function returnToMenu() {
      document.getElementById('game-screen').style.display = 'none';
      document.getElementById('menu-screen').style.display = 'flex';
    }

    function resetBoard() {
      boardState = JSON.parse(JSON.stringify(initialBoardState));
      currentStepIdx = 0;
      isProcessingCpu = false;
      renderBoard();

      // Caso a IA precise fazer o lance inicial (ex: Pretas)
      const step = currentTree.steps[0];
      if (step && step.cpuBefore) {
        executeMove(step.cpuBefore.from, step.cpuBefore.to);
      }

      highlightStep();
    }

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';

      const isFlipped = (selectedSide === 'b');
      
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const row = isFlipped ? 7 - r : r;
          const col = isFlipped ? 7 - c : c;

          const square = document.createElement('div');
          square.className = `square ${(row + col) % 2 === 0 ? 'white' : 'black'}`;
          
          const algCoord = coordsToAlg(row, col);
          square.dataset.coord = algCoord;

          const pieceSymbol = boardState[row][col];
          if (pieceSymbol) {
            const pieceEl = document.createElement('span');
            pieceEl.className = 'piece';
            pieceEl.textContent = PIECES[pieceSymbol] || pieceSymbol;
            
            if (pieceSymbol === pieceSymbol.toUpperCase()) {
              pieceEl.style.color = '#ffffff';
              pieceEl.style.textShadow = '0 0 3px #000, 0 0 5px #000';
            } else {
              pieceEl.style.color = '#111111';
            }
            square.appendChild(pieceEl);
          }

          square.onclick = () => handleSquareClick(algCoord);
          boardEl.appendChild(square);
        }
      }
    }

    function coordsToAlg(row, col) {
      const files = ['a','b','c','d','e','f','g','h'];
      const ranks = ['8','7','6','5','4','3','2','1'];
      return files[col] + ranks[row];
    }

    function algToCoords(alg) {
      const files = ['a','b','c','d','e','f','g','h'];
      const ranks = ['8','7','6','5','4','3','2','1'];
      const col = files.indexOf(alg[0]);
      const row = ranks.indexOf(alg[1]);
      return { row, col };
    }

    function highlightStep() {
      document.querySelectorAll('.square').forEach(sq => {
        sq.classList.remove('best-move', 'worst-move');
      });

      if (!currentTree || currentStepIdx >= currentTree.steps.length) {
        document.getElementById('feedback').innerHTML = "<b>🏆 Parabéns!</b> Você completou todas as etapas deste treinamento com maestria!";
        return;
      }

      const step = currentTree.steps[currentStepIdx];

      // Destaca Origem e Destino do Melhor Lance em Verde
      const bestFromSq = document.querySelector(`[data-coord="${step.playerMove.from}"]`);
      const bestToSq = document.querySelector(`[data-coord="${step.playerMove.to}"]`);
      if (bestFromSq) bestFromSq.classList.add('best-move');
      if (bestToSq) bestToSq.classList.add('best-move');

      // Destaca Pior Destino em Vermelho
      const worstToSq = document.querySelector(`[data-coord="${step.worstMove.to}"]`);
      if (worstToSq) worstToSq.classList.add('worst-move');

      document.getElementById('feedback').innerHTML = step.tip;
    }

    function handleSquareClick(coord) {
      if (isProcessingCpu || !currentTree || currentStepIdx >= currentTree.steps.length) return;

      const step = currentTree.steps[currentStepIdx];

      if (coord === step.playerMove.to) {
        // Lance Correto do Aluno
        executeMove(step.playerMove.from, step.playerMove.to);
        
        // Resposta da IA se houver
        if (step.cpuResponse) {
          isProcessingCpu = true;
          document.getElementById('feedback').innerHTML = "🤖 <i>IA pensando na resposta...</i>";
          
          setTimeout(() => {
            executeMove(step.cpuResponse.from, step.cpuResponse.to);
            currentStepIdx++;
            isProcessingCpu = false;
            highlightStep();
          }, 750);
        } else {
          currentStepIdx++;
          highlightStep();
        }
      } else if (coord === step.worstMove.to) {
        alert("🔴 ATENÇÃO: Esse é o pior lance possível nesta posição! Preste atenção na dica no topo antes de mover.");
      }
    }

    function executeMove(fromAlg, toAlg) {
      const from = algToCoords(fromAlg);
      const to = algToCoords(toAlg);

      boardState[to.row][to.col] = boardState[from.row][from.col];
      boardState[from.row][from.col] = '';
      renderBoard();
    }

    window.onload = () => {
      selectSide('w');
    };
  </script>
</body>
</html>
