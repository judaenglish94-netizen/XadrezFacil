<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Xadrez Guiado - Caminho do Mate até 800</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #6a3e1b;
      /* Textura de madeira envelhecida estilo cartoon */
      background-image: 
        radial-gradient(ellipse at 20% 30%, rgba(35, 18, 7, 0.4) 0%, transparent 40%),
        radial-gradient(ellipse at 80% 70%, rgba(35, 18, 7, 0.4) 0%, transparent 40%),
        repeating-linear-gradient(0deg, transparent, transparent 38px, rgba(40, 20, 8, 0.5) 39px, rgba(40, 20, 8, 0.5) 41px),
        linear-gradient(90deg, #573114 0%, #774720 25%, #573114 50%, #774720 75%, #573114 100%);
      background-size: 100% 100%, 100% 100%, 100% 41px, 200px 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f0e6d2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }

    header {
      text-align: center;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.7rem;
      color: #fff3d1;
      text-shadow: 2px 3px 0px #2a1405, -1px -1px 0 #2a1405, 1px -1px 0 #2a1405;
    }

    p.subtitle {
      font-size: 0.85rem;
      color: #f3e5ab;
      text-shadow: 1px 1px 2px #000;
    }

    .container {
      max-width: 450px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* MENU PRINCIPAL INICIAL */
    #menu-screen {
      background: rgba(25, 12, 4, 0.96);
      border: 3px solid #b8860b;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .menu-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: #f3e5ab;
      border-bottom: 2px dashed #8b5a2b;
      padding-bottom: 8px;
      text-align: center;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    label {
      font-weight: bold;
      font-size: 0.9rem;
      color: #f3e5ab;
    }

    .color-buttons {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .btn-color {
      flex: 1;
      padding: 12px;
      background: #5c3a21;
      color: #fff;
      border: 2px solid #a67c52;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-color.selected {
      background: #2e7d32;
      border-color: #81c784;
      box-shadow: 0 0 10px rgba(76, 175, 80, 0.7);
    }

    select {
      background: #2b180d;
      color: #f3e5ab;
      border: 2px solid #b8860b;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      width: 100%;
      outline: none;
    }

    .btn-start {
      background: #2e7d32;
      color: #fff;
      border: 2px solid #81c784;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 5px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    /* TELA DE JOGO */
    #game-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: rgba(25, 12, 4, 0.93);
      border: 2px solid #b8860b;
      padding: 8px 12px;
      border-radius: 8px;
    }

    .game-title-info {
      font-weight: bold;
      color: #f3e5ab;
      font-size: 0.85rem;
    }

    .btn-back {
      background: #78909c;
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.8rem;
    }

    .feedback-box {
      background: rgba(15, 6, 2, 0.93);
      border-left: 5px solid #00d2ff;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      line-height: 1.35;
      width: 100%;
      min-height: 52px;
    }

    .feedback-box .bad-tip {
      color: #ff6b6b;
      margin-top: 3px;
      display: block;
    }

    /* TABULEIRO VERDE E BRANCO ESCOLAR */
    .board-wrapper {
      border: 8px solid #2a160a;
      border-radius: 6px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.85);
      background: #2a160a;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(8, 44px);
      grid-template-rows: repeat(8, 44px);
      width: 352px;
      height: 352px;
      user-select: none;
    }

    .square {
      width: 44px;
      height: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      cursor: pointer;
      font-size: 34px;
      line-height: 1;
    }

    .square.white { background-color: #eeeed2; }
    .square.black { background-color: #769656; }

    /* PEÇA DE ORIGEM DA JOGADA */
    .square.source-move {
      box-shadow: inset 0 0 0 3px #0288d1;
      background-color: rgba(2, 136, 209, 0.45) !important;
    }

    /* LUZ AZUL NEON (CASA DE DESTINO DA MELHOR JOGADA) */
    .square.best-move {
      box-shadow: inset 0 0 0 3px #0088cc, 0 0 12px #00d2ff;
      background-color: rgba(0, 210, 255, 0.75) !important;
      animation: pulse-blue 1.4s infinite alternate;
    }

    /* LUZ VERMELHA (PIOR JOGADA) */
    .square.worst-move {
      box-shadow: inset 0 0 0 3px #c62828, 0 0 10px #f44336;
      background-color: rgba(244, 67, 54, 0.75) !important;
      animation: pulse-red 1.4s infinite alternate;
    }

    @keyframes pulse-blue {
      from { box-shadow: inset 0 0 0 3px #0077b6, 0 0 6px #00d2ff; }
      to { box-shadow: inset 0 0 0 4px #023e8a, 0 0 16px #48cae4; }
    }

    @keyframes pulse-red {
      from { box-shadow: inset 0 0 0 3px #c62828, 0 0 5px #f44336; }
      to { box-shadow: inset 0 0 0 4px #8e0000, 0 0 14px #e57373; }
    }

    .piece-symbol {
      pointer-events: none;
      user-select: none;
    }
    .piece-white {
      color: #ffffff;
      text-shadow: 0 0 3px #000, 0 0 5px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    }
    .piece-black {
      color: #111111;
      text-shadow: 0 0 2px #fff;
    }

    .legend {
      display: flex;
      gap: 12px;
      justify-content: center;
      font-size: 0.8rem;
      margin-top: 2px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .dot.blue { background: #00d2ff; box-shadow: 0 0 5px #00d2ff; }
    .dot.red { background: #f44336; box-shadow: 0 0 5px #f44336; }

    /* MODAL DE XEQUE-MATE */
    .modal-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      border-radius: 12px;
      z-index: 100;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }

    .modal-card {
      background: #2b180d;
      border: 3px solid #00d2ff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 25px rgba(0, 210, 255, 0.4);
      max-width: 92%;
    }

    .modal-card h2 {
      font-size: 1.4rem;
      color: #00d2ff;
      margin-bottom: 8px;
    }

    .modal-card p {
      font-size: 0.9rem;
      color: #f3e5ab;
      margin-bottom: 15px;
      line-height: 1.4;
    }

    .modal-btns {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .btn-modal {
      background: #2e7d32;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-modal.view-btn {
      background: #0288d1;
    }

    .btn-modal.menu-btn {
      background: #78909c;
    }

    .post-view-bar {
      display: none;
      gap: 10px;
      margin-top: 6px;
      width: 100%;
    }

    .post-view-bar button {
      flex: 1;
      padding: 10px;
      font-size: 0.85rem;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      color: #fff;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 370px) {
      #board {
        grid-template-columns: repeat(8, 38px);
        grid-template-rows: repeat(8, 38px);
        width: 304px;
        height: 304px;
      }
      .square {
        width: 38px;
        height: 38px;
        font-size: 28px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>♟️ Xadrez Guiado</h1>
    <p class="subtitle">Aprendizado por contraste visual até 800 de rating</p>
  </header>

  <div class="container">
    
    <!-- TELA 1: MENU PRINCIPAL INICIAL -->
    <div id="menu-screen">
      <div class="menu-title">Configurar Treinamento</div>

      <div class="form-group">
        <label>1. Sua Cor:</label>
        <div class="color-buttons">
          <button class="btn-color selected" id="btn-w" onclick="selectSide('w')">⚪ Brancas</button>
          <button class="btn-color" id="btn-b" onclick="selectSide('b')">⚫ Pretas</button>
        </div>
      </div>

      <div class="form-group">
        <label for="opening-select">2. Estudo / Abertura (3 Brancas / 3 Pretas):</label>

      </div>

      <button class="btn-start" onclick="startGame()">🚀 Iniciar Treinamento</button>
    </div>

    <!-- TELA 2: ÁREA DA PARTIDA -->

      <div class="game-header">
        <span class="game-title-info" id="current-opening-title">---</span>

      </div>

      <div class="feedback-box" id="feedback">
        Carregando...

      <div class="board-wrapper">
        <div id="board"></div>
      </div>

      <div class="legend">
        <div class="legend-item"><span class="dot blue"></span> 🔵 Melhor Casa</div>
        <div class="legend-item"><span class="dot red"></span> 🔴 Pior Casa</div>
      </div>

      <!-- Barra de Ações ao Visualizar o Mate -->
      <div class="post-view-bar" id="post-view-bar">
        <button style="background:#2e7d32;" onclick="resetBoard()">🔄 Repetir Linha</button>
        <button style="background:#78909c;" onclick="returnToMenu()">⚙️ Mudar Estudo</button>
      </div>
    </div>

    <!-- MODAL DE XEQUE-MATE -->

        <div class="modal-btns">
          <button class="btn-modal view-btn" onclick="inspectMate()">👁️ Visualizar Xeque-Mate</button>
          <button class="btn-modal" onclick="resetBoard(); closeModal();">🔄 Repetir (Nova Linha)</button>
          <button class="btn-modal menu-btn" onclick="returnToMenu(); closeModal();">⚙️ Mudar Estudo</button>
        </div>
      </div>
    </div>

  </div>

    let isProcessingCpu = false;

    const initialBoardState = [
      ['r','n','b','q','k','b','n','r'],
      ['p','p','p','p','p','p','p','p'],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['P','P','P','P','P','P','P','P'],
      ['R','N','B','Q','K','B','N','R']
    ];

    let boardState = [];

    function selectSide(side) {
      selectedSide = side;
      document.getElementById('btn-w').classList.toggle('selected', side === 'w');
      document.getElementById('btn-b').classList.toggle('selected', side === 'b');
      updateOpeningSelectOptions();
    }

    function updateOpeningSelectOptions() {
      const select = document.getElementById('opening-select');
      select.innerHTML = '';
      STUDY_TREES[selectedSide].forEach((tree, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = tree.name;
        select.appendChild(opt);
      });
    }

    function startGame() {
      const idx = document.getElementById('opening-select').value;
      currentTree = STUDY_TREES[selectedSide][idx];
      
      document.getElementById('menu-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'flex';
      document.getElementById('current-opening-title').textContent = currentTree.name;

      resetBoard();
    }

    function returnToMenu() {
      document.getElementById('game-screen').style.display = 'none';
      document.getElementById('menu-screen').style.display = 'flex';
      document.getElementById('post-view-bar').style.display = 'none';
      closeModal();
    }

    function resetBoard() {
      boardState = JSON.parse(JSON.stringify(initialBoardState));
      currentStepIdx = 0;
      isProcessingCpu = false;
      document.getElementById('post-view-bar').style.display = 'none';
      closeModal();
      renderBoard();

      const step = currentTree.steps[0];
      if (step && step.cpuBefore) {
        executeMove(step.cpuBefore.from, step.cpuBefore.to);
      }

      highlightStep();
    }

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';

      const isFlipped = (selectedSide === 'b');
      
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const row = isFlipped ? 7 - r : r;
          const col = isFlipped ? 7 - c : c;

          const square = document.createElement('div');
          square.className = `square ${(row + col) % 2 === 0 ? 'white' : 'black'}`;
          
          const algCoord = coordsToAlg(row, col);
          square.dataset.coord = algCoord;

          const pieceSymbol = boardState[row][col];
          if (pieceSymbol && PIECES_MAP[pieceSymbol]) {
            const pieceEl = document.createElement('span');
            pieceEl.className = `piece-symbol ${pieceSymbol === pieceSymbol.toUpperCase() ? 'piece-white' : 'piece-black'}`;
            pieceEl.textContent = PIECES_MAP[pieceSymbol];
            square.appendChild(pieceEl);
          }

          square.onclick = () => handleSquareClick(algCoord);
          boardEl.appendChild(square);
        }
      }
    }

    function coordsToAlg(row, col) {
      const files = ['a','b','c','d','e','f','g','h'];
      const ranks = ['8','7','6','5','4','3','2','1'];
      return files[col] + ranks[row];
    }

    function algToCoords(alg) {
      const files = ['a','b','c','d','e','f','g','h'];
      const ranks = ['8','7','6','5','4','3','2','1'];
      const col = files.indexOf(alg[0]);
      const row = ranks.indexOf(alg[1]);
      return { row, col };
    }

    function highlightStep() {
      document.querySelectorAll('.square').forEach(sq => {
        sq.classList.remove('best-move', 'worst-move', 'source-move');
      });

      if (!currentTree || currentStepIdx >= currentTree.steps.length) {
        showVictoryModal();
        return;
      }

      const step = currentTree.steps[currentStepIdx];

      // Origem
      const sourceSq = document.querySelector(`[data-coord="${step.playerMove.from}"]`);
      if (sourceSq) sourceSq.classList.add('source-move');

      // Destino Ideal (Azul Neon)
      const bestToSq = document.querySelector(`[data-coord="${step.playerMove.to}"]`);
      if (bestToSq) bestToSq.classList.add('best-move');

      // Pior Lance (Vermelho)
      if (step.worstMove && step.worstMove.to !== step.playerMove.to) {
        const worstToSq = document.querySelector(`[data-coord="${step.worstMove.to}"]`);
        if (worstToSq) worstToSq.classList.add('worst-move');
      }

      document.getElementById('feedback').innerHTML = step.tip;
    }

    function handleSquareClick(coord) {
      if (isProcessingCpu || !currentTree || currentStepIdx >= currentTree.steps.length) return;

      const step = currentTree.steps[currentStepIdx];

      if (coord === step.playerMove.to) {
        executeMove(step.playerMove.from, step.playerMove.to);
        
        if (step.cpuResponse) {
          isProcessingCpu = true;
          document.getElementById('feedback').innerHTML = `🤖 <i>IA respondendo...</i>`;
          
          setTimeout(() => {
            executeMove(step.cpuResponse.from, step.cpuResponse.to);
            currentStepIdx++;
            isProcessingCpu = false;
            highlightStep();
          }, 550);
        } else {
          currentStepIdx++;
          highlightStep();
        }
      } else if (step.worstMove && coord === step.worstMove.to && step.worstMove.to !== step.playerMove.to) {
        alert("🔴 ATENÇÃO: Esse é o pior lance possível nesta posição! Veja a orientação no topo.");
      }
    }

    function executeMove(fromAlg, toAlg) {
      const from = algToCoords(fromAlg);
      const to = algToCoords(toAlg);

      boardState[to.row][to.col] = boardState[from.row][from.col];
      boardState[from.row][from.col] = '';
      renderBoard();
    }

    function showVictoryModal() {
      document.getElementById('feedback').innerHTML = "<b>🏆 PARABÉNS! XEQUE-MATE REAL CONCLUÍDO!</b>";
      document.getElementById('victory-modal').style.display = 'flex';
    }

    function inspectMate() {
      closeModal();
      document.getElementById('post-view-bar').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('victory-modal').style.display = 'none';
    }

    window.onload = () => {
      selectSide('w');
    };
  </script>
</body>
</html>
