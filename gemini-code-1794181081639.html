<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Xadrez Guiado - Caminho do Mate</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: #6a3e1b;
      background-image: 
        radial-gradient(ellipse at 20% 30%, rgba(35, 18, 7, 0.4) 0%, transparent 40%),
        radial-gradient(ellipse at 80% 70%, rgba(35, 18, 7, 0.4) 0%, transparent 40%),
        repeating-linear-gradient(0deg, transparent, transparent 38px, rgba(40, 20, 8, 0.5) 39px, rgba(40, 20, 8, 0.5) 41px),
        linear-gradient(90deg, #573114 0%, #774720 25%, #573114 50%, #774720 75%, #573114 100%);
      background-size: 100% 100%, 100% 100%, 100% 41px, 200px 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f0e6d2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }

    header { text-align: center; margin-bottom: 12px; }
    h1 { font-size: 1.7rem; color: #fff3d1; text-shadow: 2px 3px 0px #2a1405; }
    p.subtitle { font-size: 0.85rem; color: #f3e5ab; text-shadow: 1px 1px 2px #000; }

    .container {
      max-width: 450px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* NOTIFICAÇÃO MODERNA (TOAST) PARA PIOR JOGADA */
    .toast-warning {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: linear-gradient(135deg, #b71c1c, #d32f2f);
      color: #fff;
      padding: 12px 18px;
      border-radius: 10px;
      border: 2px solid #ff8a80;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      font-size: 0.88rem;
      font-weight: 600;
      z-index: 999;
      opacity: 0;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
      text-align: center;
      max-width: 90%;
      pointer-events: none;
    }

    .toast-warning.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* MENU */
    #menu-screen {
      background: rgba(25, 12, 4, 0.96);
      border: 3px solid #b8860b;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .menu-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: #f3e5ab;
      border-bottom: 2px dashed #8b5a2b;
      padding-bottom: 8px;
      text-align: center;
    }

    .form-group { display: flex; flex-direction: column; gap: 6px; width: 100%; }
    label { font-weight: bold; font-size: 0.9rem; color: #f3e5ab; }
    .color-buttons { display: flex; gap: 10px; width: 100%; }

    .btn-color {
      flex: 1;
      padding: 12px;
      background: #5c3a21;
      color: #fff;
      border: 2px solid #a67c52;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-color.selected {
      background: #2e7d32;
      border-color: #81c784;
      box-shadow: 0 0 10px rgba(76, 175, 80, 0.7);
    }

    select {
      background: #2b180d;
      color: #f3e5ab;
      border: 2px solid #b8860b;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      width: 100%;
      outline: none;
    }

    .btn-start {
      background: #2e7d32;
      color: #fff;
      border: 2px solid #81c784;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }

    .btn-start:disabled {
      background: #4a3b32;
      border-color: #6d5b50;
      color: #aaa;
      cursor: not-allowed;
    }

    /* JOGO */
    #game-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: rgba(25, 12, 4, 0.93);
      border: 2px solid #b8860b;
      padding: 8px 12px;
      border-radius: 8px;
    }

    .game-title-info { font-weight: bold; color: #f3e5ab; font-size: 0.85rem; }

    .btn-back {
      background: #78909c;
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.8rem;
    }

    .feedback-box {
      background: rgba(15, 6, 2, 0.93);
      border-left: 5px solid #0288d1;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      line-height: 1.35;
      width: 100%;
      min-height: 54px;
    }

    .feedback-box.mate-success {
      border-left-color: #4caf50;
      background: rgba(20, 45, 20, 0.95);
      color: #c8e6c9;
      text-align: center;
      font-size: 0.95rem;
    }

    .cpu-missed-tip { color: #ff8a80; display: block; margin-top: 4px; }
    .worst-tip { color: #ffb74d; display: block; margin-top: 4px; }

    .board-wrapper {
      border: 8px solid #2a160a;
      border-radius: 6px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.85);
      background: #2a160a;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(8, 44px);
      grid-template-rows: repeat(8, 44px);
      width: 352px;
      height: 352px;
      user-select: none;
    }

    .square {
      width: 44px;
      height: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 34px;
      line-height: 1;
      position: relative;
    }

    .square.white { background-color: #eeeed2; }
    .square.black { background-color: #769656; }

    /* CAMINHO AZUL DO JOGADOR: CLARO NO TRAJETO, ESCURO NO DESTINO */
    .square.best-path {
      background-color: rgba(129, 212, 250, 0.72) !important;
      box-shadow: inset 0 0 0 2px #4fc3f7;
    }

    .square.best-dest {
      background-color: rgba(1, 87, 155, 0.90) !important;
      box-shadow: inset 0 0 0 3px #81d4fa, 0 0 12px #0288d1;
      animation: pulse-blue 1.3s infinite alternate;
    }

    /* PIOR JOGADA DO ALUNO (LARANJA/VERMELHO DE ALERTA) */
    .square.player-worst {
      background-color: rgba(255, 112, 67, 0.75) !important;
      box-shadow: inset 0 0 0 3px #e64a19;
    }

    /* CAMINHO VERMELHO DA IA (PIOR NO LANCE 1, MELHOR NOS SEGUINTES) */
    .square.cpu-red-path {
      background-color: rgba(239, 154, 154, 0.68) !important;
      box-shadow: inset 0 0 0 2px #e57373;
    }

    .square.cpu-red-dest {
      background-color: rgba(183, 28, 28, 0.88) !important;
      box-shadow: inset 0 0 0 3px #ff8a80, 0 0 10px #d32f2f;
    }

    @keyframes pulse-blue {
      from { box-shadow: inset 0 0 0 3px #4fc3f7, 0 0 6px #0288d1; }
      to { box-shadow: inset 0 0 0 4px #b3e5fc, 0 0 16px #29b6f6; }
    }

    .piece-symbol { pointer-events: none; user-select: none; z-index: 2; }
    .piece-white {
      color: #ffffff;
      text-shadow: 0 0 3px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    }
    .piece-black { color: #111111; text-shadow: 0 0 2px #fff; }

    .legend { display: flex; gap: 10px; justify-content: center; font-size: 0.76rem; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot.blue-light { background: #81d4fa; }
    .dot.blue-dark { background: #01579b; border: 1px solid #81d4fa; }
    .dot.orange { background: #ff7043; border: 1px solid #e64a19; }
    .dot.red { background: #c62828; border: 1px solid #ff8a80; }

    /* MODAL */
    .modal-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      border-radius: 12px;
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }

    .modal-card {
      background: #2b180d;
      border: 3px solid #0288d1;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 25px rgba(2, 136, 209, 0.5);
      max-width: 92%;
    }

    .modal-card h2 { font-size: 1.4rem; color: #4fc3f7; margin-bottom: 8px; }
    .modal-card p { font-size: 0.9rem; color: #f3e5ab; margin-bottom: 15px; }
    .modal-btns { display: flex; flex-direction: column; gap: 8px; }

    .btn-modal {
      background: #2e7d32;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-modal.view-btn { background: #0288d1; }
    .btn-modal.menu-btn { background: #78909c; }

    .post-view-bar { display: none; gap: 10px; margin-top: 6px; width: 100%; }
    .post-view-bar button {
      flex: 1;
      padding: 10px;
      font-size: 0.85rem;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      color: #fff;
    }

    @media (max-width: 370px) {
      #board { grid-template-columns: repeat(8, 38px); grid-template-rows: repeat(8, 38px); width: 304px; height: 304px; }
      .square { width: 38px; height: 38px; font-size: 28px; }
    }
  </style>
</head>
<body>

  <!-- TOAST MODERNO DE AVISO -->
  <div class="toast-warning" id="toast-warning">⚠️ Essa é a pior jogada! Escolha o caminho azul.</div>

  <header>
    <h1>♟️ Xadrez Guiado</h1>
    <p class="subtitle">Aprendizado por contraste visual</p>
  </header>

  <div class="container">
    <div id="menu-screen">
      <div class="menu-title">Configurar Treinamento</div>

      <div class="form-group">
        <label>1. Sua Cor:</label>
        <div class="color-buttons">
          <button class="btn-color selected" id="btn-w" onclick="selectSide('w')">⚪ Brancas</button>
          <button class="btn-color" id="btn-b" onclick="selectSide('b')">⚫ Pretas</button>
        </div>
      </div>

      <div class="form-group">
        <label for="opening-select">2. Estudo:</label>
        <select id="opening-select"></select>
      </div>

      <button class="btn-start" id="btn-start" onclick="startGame()">🚀 Iniciar Treinamento</button>
    </div>

    <div id="game-screen">
      <div class="game-header">
        <span class="game-title-info" id="current-opening-title">---</span>
        <button class="btn-back" onclick="returnToMenu()">⚙️ Menu</button>
      </div>

      <div class="feedback-box" id="feedback">Carregando...</div>

      <div class="board-wrapper"><div id="board"></div></div>

      <div class="legend">
        <div class="legend-item"><span class="dot blue-light"></span> Trajeto</div>
        <div class="legend-item"><span class="dot blue-dark"></span> Seu Destino</div>
        <div class="legend-item"><span class="dot orange"></span> Pior Sua</div>
        <div class="legend-item"><span class="dot red"></span> Destaque IA</div>
      </div>

      <div class="post-view-bar" id="post-view-bar">
        <button style="background:#2e7d32;" onclick="resetBoard()">🔄 Repetir Linha</button>
        <button style="background:#78909c;" onclick="returnToMenu()">⚙️ Menu</button>
      </div>
    </div>

    <div class="modal-overlay" id="victory-modal">
      <div class="modal-card">
        <h2>🏆 XEQUE-MATE REAL!</h2>
        <p>Você aproveitou o erro da defesa e aplicou o Mate do Pastor!</p>
        <div class="modal-btns">
          <button class="btn-modal view-btn" onclick="inspectMate()">👁️ Visualizar Xeque-Mate</button>
          <button class="btn-modal" onclick="resetBoard()">🔄 Repetir Linha</button>
          <button class="btn-modal menu-btn" onclick="returnToMenu()">⚙️ Mudar Estudo</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const PIECES_MAP = {
      'P': '♙', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔',
      'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚'
    };

    const STUDY_TREES = {
      'w': [
        {
          id: 'pastor_white',
          name: '⚔️ 1. Ataque Pastor (Brancas)',
          steps: [
            {
              playerMove: { from: 'e2', to: 'e4' },
              playerWorst: 'a3',
              tip: "🔵 <b>Sua vez:</b> Avance o peão do Rei até <b>e4</b> (azul escuro) para liberar a Dama e o Bispo.<span class='worst-tip'>🟠 <b>Pior jogada:</b> a3 perde tempo no centro.</span>",
              cpuResponse: { from: 'e7', to: 'e5' }, // Lance 1: IA joga a melhor defesa (e5)
              cpuRedHighlight: { from: 'a7', to: 'a6', label: "🔴 <b>Em vermelho:</b> O que seria a pior jogada das negras (a6)." }
            },
            {
              playerMove: { from: 'd1', to: 'h5' },
              playerWorst: 'e2',
              tip: "🔵 <b>Sua vez:</b> Leve a Dama pela diagonal até <b>h5</b>, mirando o ponto fraco f7.<span class='worst-tip'>🟠 <b>Pior jogada:</b> De2 não gera ameaça.</span>",
              cpuResponse: { from: 'b8', to: 'c6' }, // Lance 2: IA desenvolve Nc6
              cpuRedHighlight: { from: 'g7', to: 'g6', label: "🔴 <b>Em vermelho:</b> A melhor defesa das negras seria <b>g6</b> (atacando a Dama)." }
            },
            {
              playerMove: { from: 'f1', to: 'c4' },
              playerWorst: 'e2',
              tip: "🔵 <b>Sua vez:</b> Desenvolva o Bispo até <b>c4</b> para formar a bateria de ataque em f7.<span class='worst-tip'>🟠 <b>Pior jogada:</b> Be2 fecha a bateria.</span>",
              cpuResponse: { from: 'a7', to: 'a6' }, // Lance 3: IA joga lance fraco (a6) permitindo o mate
              cpuRedHighlight: { from: 'd8', to: 'e7', label: "🔴 <b>Em vermelho:</b> A melhor defesa das negras seria <b>De7</b> (protegendo f7)." }
            },
            {
              playerMove: { from: 'h5', to: 'f7' },
              playerWorst: 'e5',
              tip: "🔵 <b>Sua vez:</b> A IA jogou <b>a6</b> e deixou <b>f7</b> sem defesa! Finalize com <b>Dama em f7</b>.<span class='worst-tip'>🟠 <b>Pior jogada:</b> Dxe5+ deixa escapar o mate imediato.</span>",
              cpuResponse: null,
              cpuRedHighlight: null
            }
          ]
        }
      ],
      'b': []
    };

    const INITIAL_BOARD = [
      ['r','n','b','q','k','b','n','r'],
      ['p','p','p','p','p','p','p','p'],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['P','P','P','P','P','P','P','P'],
      ['R','N','B','Q','K','B','N','R']
    ];

    let selectedSide = 'w';
    let currentTree = null;
    let currentStepIdx = 0;
    let isProcessingCpu = false;
    let boardState = [];
    let currentCpuRed = null;
    let modalTimer = null;
    let toastTimer = null;

    function selectSide(side) {
      selectedSide = side;
      document.getElementById('btn-w').classList.toggle('selected', side === 'w');
      document.getElementById('btn-b').classList.toggle('selected', side === 'b');
      
      const select = document.getElementById('opening-select');
      const startBtn = document.getElementById('btn-start');
      select.innerHTML = '';

      if (STUDY_TREES[side].length === 0) {
        const opt = document.createElement('option');
        opt.textContent = '⏳ Em breve (em desenvolvimento)';
        select.appendChild(opt);
        startBtn.disabled = true;
      } else {
        STUDY_TREES[side].forEach((tree, idx) => {
          const opt = document.createElement('option');
          opt.value = idx;
          opt.textContent = tree.name;
          select.appendChild(opt);
        });
        startBtn.disabled = false;
      }
    }

    function startGame() {
      const idx = document.getElementById('opening-select').value;
      currentTree = STUDY_TREES[selectedSide][idx];
      if (!currentTree) return;

      document.getElementById('menu-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'flex';
      document.getElementById('current-opening-title').textContent = currentTree.name;
      resetBoard();
    }

    function returnToMenu() {
      clearTimeout(modalTimer);
      document.getElementById('game-screen').style.display = 'none';
      document.getElementById('menu-screen').style.display = 'flex';
      document.getElementById('post-view-bar').style.display = 'none';
      document.getElementById('victory-modal').style.display = 'none';
    }

    function resetBoard() {
      clearTimeout(modalTimer);
      boardState = JSON.parse(JSON.stringify(INITIAL_BOARD));
      currentStepIdx = 0;
      isProcessingCpu = false;
      currentCpuRed = null;
      document.getElementById('post-view-bar').style.display = 'none';
      document.getElementById('victory-modal').style.display = 'none';
      document.getElementById('feedback').classList.remove('mate-success');
      renderBoard();
      highlightStep();
    }

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const square = document.createElement('div');
          square.className = `square ${(r + c) % 2 === 0 ? 'white' : 'black'}`;
          
          const algCoord = coordsToAlg(r, c);
          square.dataset.coord = algCoord;

          const piece = boardState[r][c];
          if (piece && PIECES_MAP[piece]) {
            const span = document.createElement('span');
            span.className = `piece-symbol ${piece === piece.toUpperCase() ? 'piece-white' : 'piece-black'}`;
            span.textContent = PIECES_MAP[piece];
            square.appendChild(span);
          }

          square.onclick = () => handleSquareClick(algCoord);
          boardEl.appendChild(square);
        }
      }
    }

    function coordsToAlg(row, col) {
      return 'abcdefgh'[col] + '87654321'[row];
    }

    function algToCoords(alg) {
      return {
        col: 'abcdefgh'.indexOf(alg[0]),
        row: '87654321'.indexOf(alg[1])
      };
    }

    function getPathSquares(fromAlg, toAlg) {
      const from = algToCoords(fromAlg);
      const to = algToCoords(toAlg);
      const path = [fromAlg];

      const rowDiff = to.row - from.row;
      const colDiff = to.col - from.col;
      const isStraight = (rowDiff === 0 || colDiff === 0);
      const isDiagonal = (Math.abs(rowDiff) === Math.abs(colDiff));

      if (isStraight || isDiagonal) {
        const dr = Math.sign(rowDiff);
        const dc = Math.sign(colDiff);
        let r = from.row + dr;
        let c = from.col + dc;

        while (r !== to.row || c !== to.col) {
          path.push(coordsToAlg(r, c));
          r += dr;
          c += dc;
        }
      }
      return path;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast-warning');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2600);
    }

    function highlightStep() {
      document.querySelectorAll('.square').forEach(sq => {
        sq.classList.remove('best-path', 'best-dest', 'player-worst', 'cpu-red-path', 'cpu-red-dest');
      });

      const feedbackEl = document.getElementById('feedback');

      if (!currentTree || currentStepIdx >= currentTree.steps.length) {
        feedbackEl.classList.add('mate-success');
        feedbackEl.innerHTML = "<b>🎉 Parabéns! Você conseguiu fazer o xeque-mate.</b>";
        modalTimer = setTimeout(() => {
          document.getElementById('victory-modal').style.display = 'flex';
        }, 5000);
        return;
      }

      // 1. Destaca em VERMELHO a referência da IA (pior no lance 1, melhor nos seguintes)
      if (currentCpuRed) {
        const redPath = getPathSquares(currentCpuRed.from, currentCpuRed.to);
        redPath.forEach(coord => {
          document.querySelector(`[data-coord="${coord}"]`)?.classList.add('cpu-red-path');
        });
        document.querySelector(`[data-coord="${currentCpuRed.to}"]`)?.classList.add('cpu-red-dest');
      }

      // 2. Destaca em AZUL a melhor jogada do aluno (trajeto claro, destino escuro)
      const step = currentTree.steps[currentStepIdx];
      const playerPath = getPathSquares(step.playerMove.from, step.playerMove.to);
      playerPath.forEach(coord => {
        document.querySelector(`[data-coord="${coord}"]`)?.classList.add('best-path');
      });
      document.querySelector(`[data-coord="${step.playerMove.to}"]`)?.classList.add('best-dest');

      // 3. Destaca em LARANJA/VERMELHO a pior jogada do aluno
      if (step.playerWorst) {
        document.querySelector(`[data-coord="${step.playerWorst}"]`)?.classList.add('player-worst');
      }

      let tipHtml = step.tip;
      if (currentCpuRed && currentCpuRed.label) {
        tipHtml += `<span class='cpu-missed-tip'>${currentCpuRed.label}</span>`;
      }
      feedbackEl.innerHTML = tipHtml;
    }

    function handleSquareClick(coord) {
      if (isProcessingCpu || !currentTree || currentStepIdx >= currentTree.steps.length) return;
      const step = currentTree.steps[currentStepIdx];

      if (coord === step.playerMove.to) {
        executeMove(step.playerMove.from, step.playerMove.to);
        
        if (step.cpuResponse) {
          isProcessingCpu = true;
          currentCpuRed = null;
          document.getElementById('feedback').innerHTML = `🤖 <i>IA respondendo...</i>`;
          setTimeout(() => {
            executeMove(step.cpuResponse.from, step.cpuResponse.to);
            currentCpuRed = step.cpuRedHighlight;
            currentStepIdx++;
            isProcessingCpu = false;
            highlightStep();
          }, 550);
        } else {
          currentCpuRed = null;
          currentStepIdx++;
          highlightStep();
        }
      } else if (step.playerWorst && coord === step.playerWorst) {
        showToast("⚠️ Essa é a pior jogada possível! Siga o caminho azul.");
      }
    }

    function executeMove(fromAlg, toAlg) {
      const from = algToCoords(fromAlg);
      const to = algToCoords(toAlg);
      boardState[to.row][to.col] = boardState[from.row][from.col];
      boardState[from.row][from.col] = '';
      renderBoard();
    }

    function inspectMate() {
      document.getElementById('victory-modal').style.display = 'none';
      document.getElementById('post-view-bar').style.display = 'flex';
    }

    window.onload = () => selectSide('w');
  </script>
</body>
</html>
