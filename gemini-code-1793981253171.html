<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xadrez Guiado até 800 Rating</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #3d2314 linear-gradient(135deg, rgba(0,0,0,0.4), rgba(0,0,0,0.7));
      background-size: cover;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #f0e6d2;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 1.8rem;
      color: #f3e5ab;
      text-shadow: 2px 2px 4px #000;
    }

    p.subtitle {
      font-size: 0.95rem;
      color: #c2b280;
    }

    /* Container Principal */
    .app-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      max-width: 600px;
      width: 100%;
    }

    /* Controls Panel */
    .controls-panel {
      background: rgba(20, 10, 5, 0.85);
      border: 2px solid #8b5a2b;
      border-radius: 12px;
      padding: 15px;
      width: 100%;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .selector-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    label {
      font-weight: bold;
      font-size: 0.9rem;
      color: #e6c687;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn {
      background: #5c3a21;
      color: #fff;
      border: 1px solid #a67c52;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .btn:hover {
      background: #7a4e2c;
    }

    .btn.active {
      background: #2e7d32;
      border-color: #81c784;
      box-shadow: 0 0 8px rgba(76, 175, 80, 0.6);
    }

    select {
      background: #2b180d;
      color: #f3e5ab;
      border: 1px solid #8b5a2b;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      width: 100%;
      cursor: pointer;
    }

    /* Feedback Display */
    .feedback-box {
      background: rgba(0, 0, 0, 0.6);
      border-left: 4px solid #4caf50;
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 0.9rem;
      line-height: 1.4;
      min-height: 48px;
    }
    
    .feedback-box .bad-tip {
      color: #ff6b6b;
      margin-top: 4px;
    }

    /* Tabuleiro Verde e Branco (Estilo Napa Escolar) */
    .board-wrapper {
      border: 12px solid #2a160a;
      border-radius: 8px;
      box-shadow: 0 12px 24px rgba(0,0,0,0.7);
      background: #2a160a;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(8, 56px);
      grid-template-rows: repeat(8, 56px);
      width: 448px;
      height: 448px;
      user-select: none;
    }

    .square {
      width: 56px;
      height: 56px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 38px;
      position: relative;
      cursor: pointer;
    }

    .square.white {
      background-color: #eeeed2;
      color: #333;
    }

    .square.black {
      background-color: #769656;
      color: #333;
    }

    /* Guias de Luz (Melhor e Pior Lance) */
    .square.best-move {
      box-shadow: inset 0 0 0 4px #2e7d32, 0 0 12px #4caf50;
      background-color: rgba(76, 175, 80, 0.65) !important;
      animation: pulse-green 1.5s infinite alternate;
    }

    .square.worst-move {
      box-shadow: inset 0 0 0 4px #c62828, 0 0 12px #f44336;
      background-color: rgba(244, 67, 54, 0.65) !important;
      animation: pulse-red 1.5s infinite alternate;
    }

    @keyframes pulse-green {
      from { box-shadow: inset 0 0 0 3px #2e7d32, 0 0 6px #4caf50; }
      to { box-shadow: inset 0 0 0 5px #1b5e20, 0 0 16px #81c784; }
    }

    @keyframes pulse-red {
      from { box-shadow: inset 0 0 0 3px #c62828, 0 0 6px #f44336; }
      to { box-shadow: inset 0 0 0 5px #8e0000, 0 0 16px #e57373; }
    }

    /* Peças */
    .piece {
      cursor: grab;
      z-index: 2;
    }

    /* Legenda das luzes */
    .legend {
      display: flex;
      gap: 15px;
      justify-content: center;
      font-size: 0.85rem;
      margin-top: 5px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }

    .dot.green { background: #4caf50; box-shadow: 0 0 6px #4caf50; }
    .dot.red { background: #f44336; box-shadow: 0 0 6px #f44336; }

    /* Responsividade para celulares de alunos */
    @media (max-width: 500px) {
      #board {
        grid-template-columns: repeat(8, 42px);
        grid-template-rows: repeat(8, 42px);
        width: 336px;
        height: 336px;
      }
      .square {
        width: 42px;
        height: 42px;
        font-size: 28px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>♟️ Xadrez Guiado - Caminho do Mate</h1>
    <p class="subtitle">Aprenda visualmente o melhor e o pior lance em cada situação real</p>
  </header>

  <div class="app-container">
    <div class="controls-panel">
      <div class="selector-group">
        <label>Sua Cor:</label>
        <div class="btn-group">
          <button class="btn active" id="btn-white" onclick="setSide('w')">⚪ Brancas</button>
          <button class="btn" id="btn-black" onclick="setSide('b')">⚫ Pretas</button>
        </div>
      </div>

      <div class="selector-group">
        <label for="opening-select">Estudo / Abertura:</label>
        <select id="opening-select" onchange="changeOpening()">
          <!-- Preenchido via JS baseado na cor selecionada -->
        </select>
      </div>

      <div class="feedback-box" id="feedback">
        <strong>Dica Guiada:</strong> Escolha seu lado e plano de jogo para iluminar as casas!
      </div>
    </div>

    <div class="board-wrapper">
      <div id="board"></div>
    </div>

    <div class="legend">
      <div class="legend-item"><span class="dot green"></span> 🟢 Melhor Casa (Faça este lance)</div>
      <div class="legend-item"><span class="dot red"></span> 🔴 Pior Casa (NUNCA vá para aqui)</div>
    </div>
  </div>

  <script>
    // Mapeamento Unicode das peças clássicas 2D
    const PIECES = {
      'P': '♙', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔',
      'p': '♟', 'r': '♜', 'n': '➞', 'b': '♝', 'q': '♛', 'k': '♚'
    };

    // Estrutura de Rotas e Árvores de Aprendizado (Brancas e Pretas + Variações da CPU)
    const STUDY_TREES = {
      'w': [
        {
          id: 'pastor_white',
          name: '⚔️ Ataque Pastor (Como aplicar de Brancas)',
          steps: [
            {
              ply: 0,
              bestMove: { from: 'e2', to: 'e4' },
              worstMove: { from: 'a2', to: 'a3' },
              tip: "🟢 <b>Melhor:</b> Domine o centro com e4! Libera o Bispo e a Dama.<br><span class='bad-tip'>🔴 <b>Pior:</b> a3 perde tempo e não controla o centro.</span>"
            },
            {
              ply: 1,
              // CPU pode responder e5 (mais comum), c5 ou e6
              cpuResponses: ['e7-e5', 'c7-c5'],
              bestMove: { from: 'f1', to: 'c4' },
              worstMove: { from: 'f1', to: 'e2' },
              tip: "🟢 <b>Melhor:</b> Bispo em c4 aponta direto para a fraqueza em f7!<br><span class='bad-tip'>🔴 <b>Pior:</b> Be2 bloqueia a própria posição e diminui o ataque.</span>"
            },
            {
              ply: 2,
              bestMove: { from: 'd1', to: 'f3' }, // ou h5
              worstMove: { from: 'd1', to: 'e2' },
              tip: "🟢 <b>Melhor:</b> Dama em f3 cria a ameaça imediata de Xeque-Mate em f7!<br><span class='bad-tip'>🔴 <b>Pior:</b> De2 remove a pressão sobre f7.</span>"
            },
            {
              ply: 3,
              bestMove: { from: 'f3', to: 'f7' },
              worstMove: { from: 'f3', to: 'f6' },
              tip: "🟢 <b>XEQUE-MATE!</b> Dama toma f7 protegido pelo bispo de c4. Fim de jogo!<br><span class='bad-tip'>🔴 <b>Pior:</b> Df6 entrega a Dama de graça.</span>"
            }
          ]
        },
        {
          id: 'italian_white',
          name: '🇮🇹 Abertura Italiana (Desenvolvimento Sólido)',
          steps: [
            {
              ply: 0,
              bestMove: { from: 'e2', to: 'e4' },
              worstMove: { from: 'h2', to: 'h3' },
              tip: "🟢 <b>Melhor:</b> Peão do Rei no centro (e4).<br><span class='bad-tip'>🔴 <b>Pior:</b> h3 é passivo e atrasa o desenvolvimento.</span>"
            },
            {
              ply: 1,
              bestMove: { from: 'g1', to: 'f3' },
              worstMove: { from: 'g1', to: 'h3' },
              tip: "🟢 <b>Melhor:</b> Cavalo em f3 ataca o peão de e5 e desenvolve com ganho de tempo.<br><span class='bad-tip'>🔴 <b>Pior:</b> Cavalo na borda (Nh3) 'é uma desgraça'.</span>"
            },
            {
              ply: 2,
              bestMove: { from: 'f1', to: 'c4' },
              worstMove: { from: 'f1', to: 'b5' },
              tip: "🟢 <b>Melhor:</b> Bispo em c4 (Italiana) visando a casa fraca f7.<br><span class='bad-tip'>🔴 <b>Pior:</b> Bb5 entra na Ruy Lopez, que exige mais teoria para iniciantes.</span>"
            }
          ]
        }
      ],
      'b': [
        {
          id: 'anti_pastor_black',
          name: '🛡️ Defesa Implacável contra o Pastor (de Pretas)',
          steps: [
            {
              ply: 0,
              // Brancas jogaram e4
              bestMove: { from: 'e7', to: 'e5' },
              worstMove: { from: 'f7', to: 'f6' },
              tip: "🟢 <b>Melhor:</b> Responda com e5 igualando o centro.<br><span class='bad-tip'>🔴 <b>Pior:</b> f6 enfraquece a diagonal do Rei mortalmente!</span>"
            },
            {
              ply: 1,
              // Brancas jogaram Bc4
              bestMove: { from: 'b8', to: 'c6' },
              worstMove: { from: 'g8', to: 'h6' },
              tip: "🟢 <b>Melhor:</b> Cavalo em c6 defende o peão de e5 e desenvolve peça.<br><span class='bad-tip'>🔴 <b>Pior:</b> Nh6 deixa o cavalo mal posicionado na borda.</span>"
            },
            {
              ply: 2,
              // Brancas jogaram Qh5 (ameaçando mate em f7 e peão de e5)
              bestMove: { from: 'g7', to: 'g6' },
              worstMove: { from: 'g8', to: 'f6' },
              tip: "🟢 <b>Melhor:</b> Peão em g6 bloqueia o ataque da Dama em f7 e a expulsa!<br><span class='bad-tip'>🔴 <b>Pior:</b> Nf6 direto esquece que a Dama branca captura e7/f7 com mate!</span>"
            },
            {
              ply: 3,
              // Brancas recuam Dama para f3 (insistindo no mate em f7)
              bestMove: { from: 'g8', to: 'f6' },
              worstMove: { from: 'd7', to: 'd6' },
              tip: "🟢 <b>Melhor:</b> Agora sim Cavalo f6! Desenvolve atacando a Dama e fecha a linha de mate.<br><span class='bad-tip'>🔴 <b>Pior:</b> d6 ignora a ameaça contínua de mate em f7!</span>"
            }
          ]
        }
      ]
    };

    // Estado da Aplicação
    let currentSide = 'w';
    let currentTree = null;
    let currentStepIdx = 0;
    
    // Tabuleiro Inicial Simples
    let initialBoardState = [
      ['r','n','b','q','k','b','n','r'],
      ['p','p','p','p','p','p','p','p'],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['P','P','P','P','P','P','P','P'],
      ['R','N','B','Q','K','B','N','R']
    ];

    let boardState = JSON.parse(JSON.stringify(initialBoardState));

    function init() {
      renderOpenings();
      resetBoard();
    }

    function setSide(side) {
      currentSide = side;
      document.getElementById('btn-white').classList.toggle('active', side === 'w');
      document.getElementById('btn-black').classList.toggle('active', side === 'b');
      renderOpenings();
      resetBoard();
    }

    function renderOpenings() {
      const select = document.getElementById('opening-select');
      select.innerHTML = '';
      const trees = STUDY_TREES[currentSide];
      trees.forEach((tree, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = tree.name;
        select.appendChild(opt);
      });
      currentTree = trees[0];
    }

    function changeOpening() {
      const idx = document.getElementById('opening-select').value;
      currentTree = STUDY_TREES[currentSide][idx];
      resetBoard();
    }

    function resetBoard() {
      boardState = JSON.parse(JSON.stringify(initialBoardState));
      currentStepIdx = 0;
      renderBoard();
      highlightStep();
    }

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';

      const isFlipped = (currentSide === 'b');
      
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const row = isFlipped ? 7 - r : r;
          const col = isFlipped ? 7 - c : c;

          const square = document.createElement('div');
          square.className = `square ${(row + col) % 2 === 0 ? 'white' : 'black'}`;
          
          const algCoord = coordsToAlg(row, col);
          square.dataset.coord = algCoord;

          const pieceSymbol = boardState[row][col];
          if (pieceSymbol) {
            const pieceEl = document.createElement('span');
            pieceEl.className = 'piece';
            pieceEl.textContent = PIECES[pieceSymbol] || pieceSymbol;
            // Cor das peças para contraste visual
            if (pieceSymbol === pieceSymbol.toUpperCase()) {
              pieceEl.style.color = '#ffffff';
              pieceEl.style.textShadow = '0 0 3px #000, 0 0 5px #000';
            } else {
              pieceEl.style.color = '#111111';
            }
            square.appendChild(pieceEl);
          }

          square.onclick = () => handleSquareClick(algCoord);
          boardEl.appendChild(square);
        }
      }
    }

    function coordsToAlg(row, col) {
      const files = ['a','b','c','d','e','f','g','h'];
      const ranks = ['8','7','6','5','4','3','2','1'];
      return files[col] + ranks[row];
    }

    function algToCoords(alg) {
      const files = ['a','b','c','d','e','f','g','h'];
      const ranks = ['8','7','6','5','4','3','2','1'];
      const col = files.indexOf(alg[0]);
      const row = ranks.indexOf(alg[1]);
      return { row, col };
    }

    function highlightStep() {
      // Limpa destaques anteriores
      document.querySelectorAll('.square').forEach(sq => {
        sq.classList.remove('best-move', 'worst-move');
      });

      if (!currentTree || currentStepIdx >= currentTree.steps.length) {
        document.getElementById('feedback').innerHTML = "<b>🎉 Treino Concluído!</b> Você dominou todas as etapas desta linha até o objetivo!";
        return;
      }

      const step = currentTree.steps[currentStepIdx];

      // Destaca Origem e Destino do Melhor Lance em Verde
      const bestFromSq = document.querySelector(`[data-coord="${step.bestMove.from}"]`);
      const bestToSq = document.querySelector(`[data-coord="${step.bestMove.to}"]`);
      if (bestFromSq) bestFromSq.classList.add('best-move');
      if (bestToSq) bestToSq.classList.add('best-move');

      // Destaca Pior Destino em Vermelho
      const worstToSq = document.querySelector(`[data-coord="${step.worstMove.to}"]`);
      if (worstToSq) worstToSq.classList.add('worst-move');

      // Atualiza texto explicativo
      document.getElementById('feedback').innerHTML = step.tip;
    }

    function handleSquareClick(coord) {
      if (!currentTree || currentStepIdx >= currentTree.steps.length) return;

      const step = currentTree.steps[currentStepIdx];

      // Se clicar no destino do melhor lance, avança
      if (coord === step.bestMove.to) {
        executeMove(step.bestMove.from, step.bestMove.to);
        currentStepIdx++;

        // Simula resposta automática da máquina se houver próxima etapa
        setTimeout(() => {
          if (currentStepIdx < currentTree.steps.length) {
            // Caso a CPU precise mover antes da próxima instrução
            highlightStep();
          } else {
            highlightStep();
          }
        }, 400);
      } else if (coord === step.worstMove.to) {
        alert("🔴 ATENÇÃO: Esse é o pior lance possível nesta posição! Veja a dica no topo para entender o motivo.");
      }
    }

    function executeMove(fromAlg, toAlg) {
      const from = algToCoords(fromAlg);
      const to = algToCoords(toAlg);

      boardState[to.row][to.col] = boardState[from.row][from.col];
      boardState[from.row][from.col] = '';
      renderBoard();
    }

    // Inicializa na abertura da página
    window.onload = init;
  </script>
</body>
</html>
