<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Xadrez Guiado - Caminho do Mate até 800</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #3d2314 linear-gradient(135deg, rgba(0,0,0,0.75), rgba(0,0,0,0.95));
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f0e6d2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }

    header {
      text-align: center;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.7rem;
      color: #f3e5ab;
      text-shadow: 2px 2px 4px #000;
    }

    p.subtitle {
      font-size: 0.85rem;
      color: #c2b280;
    }

    .container {
      max-width: 450px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* -------------------------------------------------------------
       1. TELA DE MENU PRINCIPAL
    ------------------------------------------------------------- */
    #menu-screen {
      background: rgba(20, 10, 5, 0.95);
      border: 2px solid #8b5a2b;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .menu-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: #e6c687;
      border-bottom: 1px solid #8b5a2b;
      padding-bottom: 8px;
      text-align: center;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    label {
      font-weight: bold;
      font-size: 0.9rem;
      color: #f3e5ab;
    }

    .color-buttons {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .btn-color {
      flex: 1;
      padding: 12px;
      background: #5c3a21;
      color: #fff;
      border: 2px solid #a67c52;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-color.selected {
      background: #2e7d32;
      border-color: #81c784;
      box-shadow: 0 0 10px rgba(76, 175, 80, 0.7);
    }

    select {
      background: #2b180d;
      color: #f3e5ab;
      border: 1px solid #8b5a2b;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      width: 100%;
      outline: none;
    }

    .btn-start {
      background: #2e7d32;
      color: #fff;
      border: 2px solid #81c784;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 5px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    /* -------------------------------------------------------------
       2. TELA DA PARTIDA
    ------------------------------------------------------------- */
    #game-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: rgba(20, 10, 5, 0.9);
      border: 1px solid #8b5a2b;
      padding: 8px 12px;
      border-radius: 8px;
    }

    .game-title-info {
      font-weight: bold;
      color: #e6c687;
      font-size: 0.85rem;
    }

    .btn-back {
      background: #78909c;
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.8rem;
    }

    .feedback-box {
      background: rgba(0, 0, 0, 0.85);
      border-left: 4px solid #4caf50;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      line-height: 1.35;
      width: 100%;
      min-height: 52px;
    }

    .feedback-box .bad-tip {
      color: #ff6b6b;
      margin-top: 3px;
      display: block;
    }

    /* Tabuleiro Verde e Branco Napa Escolar */
    .board-wrapper {
      border: 8px solid #2a160a;
      border-radius: 6px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.8);
      background: #2a160a;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(8, 44px);
      grid-template-rows: repeat(8, 44px);
      width: 352px;
      height: 352px;
      user-select: none;
    }

    .square {
      width: 44px;
      height: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      cursor: pointer;
    }

    .square.white { background-color: #eeeed2; }
    .square.black { background-color: #769656; }

    /* Guias de Luz (Teclado Iluminado) */
    .square.best-move {
      box-shadow: inset 0 0 0 3px #2e7d32, 0 0 10px #4caf50;
      background-color: rgba(76, 175, 80, 0.7) !important;
      animation: pulse-green 1.4s infinite alternate;
    }

    .square.worst-move {
      box-shadow: inset 0 0 0 3px #c62828, 0 0 10px #f44336;
      background-color: rgba(244, 67, 54, 0.7) !important;
      animation: pulse-red 1.4s infinite alternate;
    }

    @keyframes pulse-green {
      from { box-shadow: inset 0 0 0 3px #2e7d32, 0 0 5px #4caf50; }
      to { box-shadow: inset 0 0 0 4px #1b5e20, 0 0 14px #81c784; }
    }

    @keyframes pulse-red {
      from { box-shadow: inset 0 0 0 3px #c62828, 0 0 5px #f44336; }
      to { box-shadow: inset 0 0 0 4px #8e0000, 0 0 14px #e57373; }
    }

    .piece-svg {
      width: 38px;
      height: 38px;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .piece-svg svg {
      width: 100%;
      height: 100%;
    }

    .legend {
      display: flex;
      gap: 12px;
      justify-content: center;
      font-size: 0.8rem;
      margin-top: 2px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .dot.green { background: #4caf50; box-shadow: 0 0 5px #4caf50; }
    .dot.red { background: #f44336; box-shadow: 0 0 5px #f44336; }

    /* MODAL DE FIM DE PARTIDA */
    .modal-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      border-radius: 12px;
      z-index: 100;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }

    .modal-card {
      background: #2b180d;
      border: 3px solid #81c784;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 25px rgba(76, 175, 80, 0.5);
      max-width: 90%;
    }

    .modal-card h2 {
      font-size: 1.4rem;
      color: #81c784;
      margin-bottom: 8px;
    }

    .modal-card p {
      font-size: 0.9rem;
      color: #f3e5ab;
      margin-bottom: 15px;
      line-height: 1.4;
    }

    .modal-btns {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn-modal {
      background: #2e7d32;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 370px) {
      #board {
        grid-template-columns: repeat(8, 38px);
        grid-template-rows: repeat(8, 38px);
        width: 304px;
        height: 304px;
      }
      .square {
        width: 38px;
        height: 38px;
      }
      .piece-svg {
        width: 32px;
        height: 32px;
      }
    }
  </style>
</head>

    <h1>♟️ Xadrez Guiado</h1>
    <p class="subtitle">Aprendizado por contraste visual até 800 de rating</p>

    <!-- TELA 1: MENU PRINCIPAL INICIAL -->
    <div id="menu-screen">

      <div class="form-group">
        <label>1. Sua Cor:</label>
        <div class="color-buttons">
          <button class="btn-color selected" id="btn-w" onclick="selectSide('w')">⚪ Brancas</button>
          <button class="btn-color" id="btn-b" onclick="selectSide('b')">⚫ Pretas</button>
        </div>
      </div>

      <div class="form-group">
        <label for="level-select">2. Nível da IA (Rating):</label>
        <select id="level-select">
          <option value="100">Nível 1 - 100 Rating</option>
          <option value="200">Nível 2 - 200 Rating</option>
          <option value="300">Nível 3 - 300 Rating</option>
          <option value="400">Nível 4 - 400 Rating</option>
          <option value="500">Nível 5 - 500 Rating</option>
          <option value="600">Nível 6 - 600 Rating</option>
          <option value="700">Nível 7 - 700 Rating</option>
          <option value="800" selected>Nível 8 - 800 Rating</option>
        </select>
      </div>

      <div class="form-group">
        <label for="opening-select">3. Estudo / Abertura:</label>
        <select id="opening-select"></select>
      </div>

      <button class="btn-start" onclick="startGame()">🚀 Iniciar Treinamento</button>
    </div>

    <!-- TELA 2: ÁREA DA PARTIDA -->
    <div id="game-screen">
      <div class="game-header">
        <span class="game-title-info" id="current-opening-title">---</span>
        <button class="btn-back" onclick="returnToMenu()">⚙️ Menu</button>
      </div>

      <div class="feedback-box" id="feedback">
        Carregando...
      </div>

      <div class="board-wrapper">
        <div id="board"></div>
      </div>

      <div class="legend">
        <div class="legend-item"><span class="dot green"></span> 🟢 Melhor Casa</div>
        <div class="legend-item"><span class="dot red"></span> 🔴 Pior Casa</div>
      </div>
    </div>

    <!-- MODAL DE XEQUE-MATE E FINALIZAÇÃO -->
    <div class="modal-overlay" id="victory-modal">
      <div class="modal-card">
        <h2>🏆 XEQUE-MATE!</h2>
        <p id="modal-desc">Você guiou seu jogo com precisão até a finalização do Rei adversário!</p>
        <div class="modal-btns">
          <button class="btn-modal" onclick="resetBoard(); closeModal();">🔄 Repetir (Nova Linha)</button>
          <button class="btn-modal" style="background:#78909c" onclick="returnToMenu(); closeModal();">⚙️ Mudar Estudo</button>
        </div>
      </div>
    </div>

              tip: "🟢 <b>Melhor:</b> e5 combate o centro.<br><span class='bad-tip'>🔴 <b>Pior:</b> f6 abre a diagonal do seu Rei!</span>",
              cpuOptions: [{ from: 'f1', to: 'c4' }, { from: 'd1', to: 'f3' }]
            },
            {
              playerMove: { from: 'b8', to: 'c6' },
              worstMove: { from: 'g8', to: 'h6' },
              tip: "🟢 <b>Melhor:</b> Nc6 protege e5 e ganha campo.<br><span class='bad-tip'>🔴 <b>Pior:</b> Nh6 deixa o cavalo sem rumo na borda.</span>",
              cpuOptions: [{ from: 'd1', to: 'h5' }, { from: 'g1', to: 'f3' }]
            },
            {
              playerMove: { from: 'g7', to: 'g6' },
              worstMove: { from: 'g8', to: 'f6' },
              tip: "🟢 <b>Melhor:</b> g6 bloqueia a ameaça e expulsa a Dama!<br><span class='bad-tip'>🔴 <b>Pior:</b> Nf6 direto leva mate em f7!</span>",
              cpuOptions: [{ from: 'h5', to: 'f3' }]
            },
            {
              playerMove: { from: 'g8', to: 'f6' },
              worstMove: { from: 'd7', to: 'd6' },
              tip: "🏆 <b>REFUTADO COM MATE!</b> Cavalo f6 neutraliza o ataque e garante a vitória!",
              cpuOptions: []
            }
          ]
        },
        {
          id: 'scandinavian_black',
          name: '🛡️ Defesa Escandinava (Pretas)',
          steps: [
            {
              cpuBefore: { from: 'e2', to: 'e4' },
              playerMove: { from: 'd7', to: 'd5' },
              worstMove: { from: 'a7', to: 'a6' },
              tip: "🟢 <b>Melhor:</b> d5 ataca o peão de e4 imediatamente.<br><span class='bad-tip'>🔴 <b>Pior:</b> a6 aceita a dominância rival.</span>",
              cpuOptions: [{ from: 'e4', to: 'd5' }]
            },
            {
              playerMove: { from: 'd8', to: 'd5' },
              worstMove: { from: 'c8', to: 'f5' },
              tip: "🟢 <b>Melhor:</b> Dama toma d5 dominando o centro.<br><span class='bad-tip'>🔴 <b>Pior:</b> Bf5 entrega o peão de graça.</span>",
              cpuOptions: [{ from: 'b1', to: 'c3' }]
            },
            {
              playerMove: { from: 'd5', to: 'a5' },
              worstMove: { from: 'd5', to: 'd8' },
              tip: "🟢 <b>Melhor:</b> Da5 recua com segurança na ala da Dama.<br><span class='bad-tip'>🔴 <b>Pior:</b> Dd8 recua tudo e perde o ganho de tempo.</span>",
              cpuOptions: [{ from: 'd2', to: 'd4' }]
            },
            {
              playerMove: { from: 'c8', to: 'f5' },
              worstMove: { from: 'e7', to: 'e6' },
              tip: "🏆 <b>XEQUE-MATE DE PRETAS!</b> Bispo e Dama combinados na vitória!",
              cpuOptions: []
            }
          ]
        },
        {
          id: 'carokann_black',
          name: '🛡️ Defesa Caro-Kann (Pretas)',
          steps: [
            {
              cpuBefore: { from: 'e2', to: 'e4' },
              playerMove: { from: 'c7', to: 'c6' },
              worstMove: { from: 'h7', to: 'h6' },
              tip: "🟢 <b>Melhor:</b> c6 prepara a base sólida para d5.<br><span class='bad-tip'>🔴 <b>Pior:</b> h6 não ajuda no centro.</span>",
              cpuOptions: [{ from: 'd2', to: 'd4' }]
            },
            {
              playerMove: { from: 'd7', to: 'd5' },
              worstMove: { from: 'e7', to: 'e6' },
              tip: "🟢 <b>Melhor:</b> d5 contesta o centro apoiado pelo peão de c6.<br><span class='bad-tip'>🔴 <b>Pior:</b> e6 prende seu próprio bispo claro.</span>",
              cpuOptions: [{ from: 'b1', to: 'c3' }]
            },
            {
              playerMove: { from: 'd5', to: 'e4' },
              worstMove: { from: 'c6', to: 'c5' },
              tip: "🟢 <b>Melhor:</b> dxe4 toma o peão central e abre o jogo!<br><span class='bad-tip'>🔴 <b>Pior:</b> c5 perde tempo precioso.</span>",
              cpuOptions: [{ from: 'c3', to: 'e4' }]
            },
            {
              playerMove: { from: 'c8', to: 'f5' },
              worstMove: { from: 'e7', to: 'e6' },
              tip: "🏆 <b>CONTRA-ATAQUE E MATE!</b> Caro-Kann finalizada com sucesso!",
              cpuOptions: []
            }
          ]
        }
      ]
    };

    let selectedSide = 'w';
    let selectedLevel = 800;
    let currentTree = null;
    let currentStepIdx = 0;
    let isProcessingCpu = false;

    const initialBoardState = [
      ['r','n','b','q','k','b','n','r'],
      ['p','p','p','p','p','p','p','p'],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['P','P','P','P','P','P','P','P'],
      ['R','N','B','Q','K','B','N','R']
    ];

    let boardState = [];

    function selectSide(side) {
      selectedSide = side;
      document.getElementById('btn-w').classList.toggle('selected', side === 'w');
      document.getElementById('btn-b').classList.toggle('selected', side === 'b');
      updateOpeningSelectOptions();
    }

    function updateOpeningSelectOptions() {
      const select = document.getElementById('opening-select');
      select.innerHTML = '';
      STUDY_TREES[selectedSide].forEach((tree, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = tree.name;
        select.appendChild(opt);
      });
    }

    function startGame() {
      const idx = document.getElementById('opening-select').value;
      selectedLevel = document.getElementById('level-select').value;
      currentTree = STUDY_TREES[selectedSide][idx];
      
      document.getElementById('menu-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'flex';
      document.getElementById('current-opening-title').textContent = `${currentTree.name} (${selectedLevel} Elo)`;

      resetBoard();
    }

    function returnToMenu() {
      document.getElementById('game-screen').style.display = 'none';
      document.getElementById('menu-screen').style.display = 'flex';
      closeModal();
    }

    function resetBoard() {
      boardState = JSON.parse(JSON.stringify(initialBoardState));
      currentStepIdx = 0;
      isProcessingCpu = false;
      closeModal();
      renderBoard();

      const step = currentTree.steps[0];
      if (step && step.cpuBefore) {
        executeMove(step.cpuBefore.from, step.cpuBefore.to);
      }

      highlightStep();
    }

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';

      const isFlipped = (selectedSide === 'b');
      
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const row = isFlipped ? 7 - r : r;
          const col = isFlipped ? 7 - c : c;

          const square = document.createElement('div');
          square.className = `square ${(row + col) % 2 === 0 ? 'white' : 'black'}`;
          
          const algCoord = coordsToAlg(row, col);
          square.dataset.coord = algCoord;

          const pieceSymbol = boardState[row][col];
          if (pieceSymbol && SVG_DATA[pieceSymbol]) {
            const pieceContainer = document.createElement('div');
            pieceContainer.className = 'piece-svg';
            pieceContainer.innerHTML = SVG_DATA[pieceSymbol];
            square.appendChild(pieceContainer);
          }

          square.onclick = () => handleSquareClick(algCoord);
          boardEl.appendChild(square);
        }
      }
    }

    function coordsToAlg(row, col) {
      const files = ['a','b','c','d','e','f','g','h'];
      const ranks = ['8','7','6','5','4','3','2','1'];
      return files[col] + ranks[row];
    }

    function algToCoords(alg) {
      const files = ['a','b','c','d','e','f','g','h'];
      const ranks = ['8','7','6','5','4','3','2','1'];
      const col = files.indexOf(alg[0]);
      const row = ranks.indexOf(alg[1]);
      return { row, col };
    }

    function highlightStep() {
      document.querySelectorAll('.square').forEach(sq => {
        sq.classList.remove('best-move', 'worst-move');
      });

      if (!currentTree || currentStepIdx >= currentTree.steps.length) {
        showVictoryModal();
        return;
      }

      const step = currentTree.steps[currentStepIdx];

      const bestFromSq = document.querySelector(`[data-coord="${step.playerMove.from}"]`);
      const bestToSq = document.querySelector(`[data-coord="${step.playerMove.to}"]`);
      if (bestFromSq) bestFromSq.classList.add('best-move');
      if (bestToSq) bestToSq.classList.add('best-move');

      if (step.worstMove) {
        const worstToSq = document.querySelector(`[data-coord="${step.worstMove.to}"]`);
        if (worstToSq) worstToSq.classList.add('worst-move');
      }

      document.getElementById('feedback').innerHTML = step.tip;
    }

    function handleSquareClick(coord) {
      if (isProcessingCpu || !currentTree || currentStepIdx >= currentTree.steps.length) return;

      const step = currentTree.steps[currentStepIdx];

      if (coord === step.playerMove.to) {
        executeMove(step.playerMove.from, step.playerMove.to);
        
        if (step.cpuOptions && step.cpuOptions.length > 0) {
          isProcessingCpu = true;
          document.getElementById('feedback').innerHTML = `🤖 <i>IA (${selectedLevel} Elo) calculando resposta...</i>`;
          
          const randomIndex = Math.floor(Math.random() * step.cpuOptions.length);
          const cpuMove = step.cpuOptions[randomIndex];

          setTimeout(() => {
            executeMove(cpuMove.from, cpuMove.to);
            currentStepIdx++;
            isProcessingCpu = false;
            highlightStep();
          }, 550);
        } else {
          currentStepIdx++;
          highlightStep();
        }
      } else if (step.worstMove && coord === step.worstMove.to) {
        alert("🔴 ATENÇÃO: Esse é o pior lance possível nesta posição! Preste atenção na dica antes de mover.");
      }
    }

    function executeMove(fromAlg, toAlg) {
      const from = algToCoords(fromAlg);
      const to = algToCoords(toAlg);

      boardState[to.row][to.col] = boardState[from.row][from.col];
      boardState[from.row][from.col] = '';
      renderBoard();
    }

    function showVictoryModal() {
      document.getElementById('feedback').innerHTML = "<b>🏆 PARABÉNS! XEQUE-MATE CONCLUÍDO!</b>";
      document.getElementById('victory-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('victory-modal').style.display = 'none';
    }

    window.onload = () => {
      selectSide('w');
    };
  </script>
</body>
</html>
